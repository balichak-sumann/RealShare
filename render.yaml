services:
  - type: web
    name: realshare-admin
    env: node
    rootDir: admin-dashboard
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    plan: starter # $7/month production plan
    envVars:
      # Database connection
      - key: DATABASE_URL
        sync: false # User must enter this securely in the Render dashboard

      # Firebase Config
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        sync: false

      # App Security
      - key: ADMIN_BOOTSTRAP_SECRET
        sync: false
      
      # Next.js Specific
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000 # Render assigns a port via this env var

  - type: static
    name: realshare-app
    rootDir: android-app
    buildCommand: npm install && npx expo export --platform web
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_API_URL
        sync: false
      - key: EXPO_PUBLIC_FIREBASE_API_KEY
        value: AIzaSyCDUd5PLfeEi-cdRvJwEPh0omcxfby8obI
      - key: EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN
        value: real-share-b7162.firebaseapp.com
      - key: EXPO_PUBLIC_FIREBASE_PROJECT_ID
        value: real-share-b7162
      - key: EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET
        value: real-share-b7162.firebasestorage.app
      - key: EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        value: "135004726221"
      - key: EXPO_PUBLIC_FIREBASE_APP_ID
        value: "1:135004726221:web:a1c1dfbe32c9bf3a335a84"
      - key: EXPO_PUBLIC_RAZORPAY_KEY_ID
        value: rzp_test_TSKXy2WO8gcwyH
